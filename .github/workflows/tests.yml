name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", sklearn: "scikit-learn==1.6.1" }
          - { os: ubuntu-latest, python: "3.12", sklearn: "scikit-learn" }
          - { os: ubuntu-latest, python: "3.13", sklearn: "scikit-learn" }
          - { os: windows-latest, python: "3.13", sklearn: "scikit-learn" }
          - { os: macos-latest, python: "3.13", sklearn: "scikit-learn" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.sklearn }}" -e ".[test]"
      - name: Test
        run: python -m pytest
